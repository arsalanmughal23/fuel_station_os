services:
  # PHP Application (Laravel + FrankenPHP + Octane)
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - ./backend:/var/www/html:delegated
      - ./backend/storage:/var/www/html/storage:delegated
    environment:
      - COMPOSER_HOME=/tmp/composer-cache
      - OCTANE_SERVER=frankenphp
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8000:8000"
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-queue
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - ./backend:/var/www/html:delegated
      - ./backend/storage:/var/www/html/storage:delegated
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for migrations...' &&
        while ! php artisan migrate --force --no-interaction 2>/dev/null; do
          sleep 2;
        done &&
        echo 'Starting queue worker...' &&
        php artisan queue:work --verbose --tries=3 --timeout=90 --sleep=3
      "
    networks:
      - default

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-scheduler
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - ./backend:/var/www/html:delegated
      - ./backend/storage:/var/www/html/storage:delegated
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    networks:
      - default

  nginx:
    image: nginx:alpine
    container_name: nginx-server
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: nuxt-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      - NITRO_PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    networks:
      - default

networks:
  default:
    name: fuel_station_network
    driver: bridge