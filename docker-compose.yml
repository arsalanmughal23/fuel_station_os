services:
  # PHP Application (Laravel backend)
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - .env
    volumes:
      - ./:/var/www/html:delegated
      - ./vendor:/var/www/html/vendor
      - ./storage/database:/var/www/html/storage/database:delegated
      - backend_storage:/var/www/html/storage
    environment:
      - COMPOSER_HOME=/tmp/composer-cache
    networks:
      - default
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-queue
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:delegated
      - ./vendor:/var/www/html/vendor
      - ./storage/database:/var/www/html/storage/database:delegated
      - backend_storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "
        echo '⏳ Waiting for setup...' &&
        while [ ! -f /var/www/html/storage/database/.initialized ]; do
          sleep 2;
        done &&
        echo '✅ Starting queue worker...' &&
        php artisan queue:work --verbose --tries=3 --timeout=90 --sleep=3
      "
    env_file:
      - .env
    environment:
      - COMPOSER_HOME=/tmp/composer-cache
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-scheduler
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:delegated
      - ./vendor:/var/www/html/vendor
      - ./storage/database:/var/www/html/storage/database:delegated
      - backend_storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "
        echo '⏳ Waiting for setup...' &&
        while [ ! -f /var/www/html/storage/database/.initialized ]; do
          sleep 2;
        done &&
        echo '✅ Starting scheduler...' &&
        while true; do
          php artisan schedule:run --verbose --no-interaction;
          sleep 60;
        done
      "
    env_file:
      - .env
    environment:
      - COMPOSER_HOME=/tmp/composer-cache
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: nginx-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - default

  # Frontend (Nuxt 3)
  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: nuxt-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:delegated
      - frontend_node_modules:/app/node_modules
      - frontend_build:/app/.nuxt
    env_file:
      - ./frontend/.env
    environment:
      - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL}
      - NITRO_PORT=3000
      - NODE_ENV=development
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default

networks:
  default:
    name: desktop_app_network
    driver: bridge

volumes:
  backend_storage:
  frontend_node_modules:
  frontend_build:
  nginx_logs: