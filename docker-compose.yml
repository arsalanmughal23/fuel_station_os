services:
  # PHP Application (Laravel backend)
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/var/www/html:delegated
      - ./vendor:/var/www/html/vendor
      - ./storage:/var/www/html/storage:delegated
    environment:
      - COMPOSER_HOME=/tmp/composer-cache
    networks:
      - default
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-queue
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:delegated
      - ./vendor:/var/www/html/vendor
      - ./storage:/var/www/html/storage:delegated
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for migrations...' &&
        while ! php artisan migrate --force --no-interaction 2>/dev/null; do
          sleep 2;
        done &&
        echo 'Starting queue worker...' &&
        php artisan queue:work --verbose --tries=3 --timeout=90 --sleep=3
      "
    env_file:
      - .env
    networks:
      - default

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-scheduler
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:delegated
      - ./vendor:/var/www/html/vendor
      - ./storage:/var/www/html/storage:delegated
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env
    networks:
      - default

  nginx:
    image: nginx:alpine
    container_name: nginx-server
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: nuxt-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      - NITRO_PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    networks:
      - default

networks:
  default:
    name: desktop_app_network
    driver: bridge