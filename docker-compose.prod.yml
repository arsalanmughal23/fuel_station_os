services:
  # PHP Application (Laravel + FrankenPHP + Octane) - Production
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: laravel-backend-prod
    restart: always
    env_file:
      - backend/.env.production
    volumes:
      - app_storage:/var/www/html/storage
      - db_data:/var/www/html/storage/database
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - OCTANE_SERVER=frankenphp
      - COMPOSER_HOME=/tmp/composer-cache
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8000:8000"
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: laravel-queue-prod
    restart: always
    volumes:
      - app_storage:/var/www/html/storage
      - db_data:/var/www/html/storage/database
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for migrations...' &&
        while ! php artisan migrate --force --no-interaction 2>/dev/null; do
          sleep 2;
        done &&
        echo 'Starting queue worker...' &&
        php artisan queue:work --verbose --tries=3 --timeout=90 --sleep=3
      "
    env_file:
      - backend/.env.production
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: laravel-scheduler-prod
    restart: always
    volumes:
      - app_storage:/var/www/html/storage
      - db_data:/var/www/html/storage/database
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - backend/.env.production
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: nginx-server-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile.prod
    container_name: nuxt-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL}
      - NITRO_PORT=3000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  app_storage:
  db_data:
  nginx_logs:

networks:
  default:
    name: fuel_station_network_prod
    driver: bridge